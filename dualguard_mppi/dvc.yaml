# DualGuard-MPPI pipeline. Independent of the root dvc.yaml, so `dvc repro` at
# the repo root does not reach it:
#
#     uv run dvc repro dualguard_mppi/dvc.yaml
#
# The two brt_* stages are multi-day MATLAB solves whose outputs predate this
# pipeline. They were seeded into dvc.lock with `dvc commit` rather than run,
# so they read as up to date; changing any of their deps will schedule a
# re-solve. Check `dvc status` before `dvc repro`.

stages:
  raceline_to_mat:
    cmd: uv run python utils/raceline_to_mat.py
    deps:
    - utils/raceline_to_mat.py
    - ../Buzzracer/buzzracer/data/raceline.p
    outs:
    - matlab/buzzracer_track_data.mat

  brt_buzzracer:
    wdir: matlab
    cmd: >-
      matlab -batch "addpath(genpath('~/Documents/MATLAB/helperOC'));
      addpath(genpath('~/Documents/MATLAB/ToolboxLS'));
      run('brt_buzzracer_track.m')"
    deps:
    - brt_buzzracer_track.m
    - shapeRCPTrack2D.m
    - createGridND.m
    - export_brt_with_gradient.m
    - '@BuzzracerDynamicBicycle'
    - buzzracer_track_data.mat
    outs:
    - brt_buzzracer_environment.mat

  brt_rc_wh:
    wdir: matlab
    cmd: >-
      matlab -batch "addpath(genpath('~/Documents/MATLAB/helperOC'));
      addpath(genpath('~/Documents/MATLAB/ToolboxLS'));
      run('brt_rc_wh_track.m')"
    deps:
    - brt_rc_wh_track.m
    - shapeTrack2D.m
    - export_3d_brt_with_gradient.m
    - '@RCBicycleCar'
    - rc_wh_track_data.mat
    - rc_wh_lx_reference.mat
    outs:
    - brt_rc_wh_track.mat
    - brt_rc_wh_environment.mat

  # The two experiments. Each runs until the car crashes or completes --laps laps,
  # and writes one file per plot: `plots` entries are dvc-cached images, summary.json
  # is an uncached metric so the run's numbers stay in git (the role the notebooks'
  # committed cell outputs used to play).
  #
  # run_rc_car takes its racing line from the root pipeline's reconstruct_track
  # output, the same rc_wh geometry experiments/dualguard_rc_trial.py drives. That is
  # the one dependency crossing out of this directory; `dvc repro` at the repo root
  # still does not reach these stages.
  run_rc_car:
    cmd: uv run python scripts/rc_car_jax.py --out-dir runs/rc_car
    deps:
    - scripts/rc_car_jax.py
    - scripts/rc_car_model.py
    - scripts/_env.py
    - scripts/grids.py
    - scripts/lap_tracking.py
    - scripts/plotting.py
    - scripts/runner.py
    - matlab/brt_rc_wh_track.mat
    - ../warehouse_track.py
    - ../data/warehouse_track.npz
    outs:
    - runs/rc_car/animation.gif
    metrics:
    - runs/rc_car/summary.json:
        cache: false
    plots:
    - runs/rc_car/trajectory.png
    - runs/rc_car/velocity_control.png
    - runs/rc_car/steering_control.png
    - runs/rc_car/margin.png
    - runs/rc_car/value.png
    - runs/rc_car/lap_progress.png

  run_buzzracer:
    cmd: uv run python scripts/buzzracer_jax.py --out-dir runs/buzzracer
    deps:
    - scripts/buzzracer_jax.py
    - scripts/buzzracer_model.py
    - scripts/_env.py
    - scripts/grids.py
    - scripts/lap_tracking.py
    - scripts/plotting.py
    - scripts/runner.py
    - matlab/brt_buzzracer_environment.mat
    - matlab/buzzracer_track_data.mat
    outs:
    - runs/buzzracer/animation.gif
    metrics:
    - runs/buzzracer/summary.json:
        cache: false
    plots:
    - runs/buzzracer/trajectory.png
    - runs/buzzracer/steering.png
    - runs/buzzracer/throttle.png
    - runs/buzzracer/velocity_states.png
    - runs/buzzracer/margin.png
    - runs/buzzracer/value.png
    - runs/buzzracer/lap_progress.png
